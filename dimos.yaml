title: Spatial Desktop
version: "0.1.0"
spec-version: v1.6
provides:
  openapi: 3.1.0
  info:
    title: Spatial Desktop
    version: 1.0.0
    description: The running blueprint as holograms, on a screen and in a headset, with a chat to a coding agent.
  paths: {}
  # The agent bridge runs a coding agent as this user: only this app's own pages may reach it.
  x-private:
    - api/agent/*
uses:
  "@dimos-gateway":
    - GET active
    - GET active/modules
    - GET active/stats
    - GET active/log
    - POST active/stop
    - POST active/modules/{id}/rpcs/{name}
    - POST active/modules/{id}/restart
    - POST active/modules/{id}/stop
    - GET catalog/blueprints
    - GET catalog/blueprints/{name}
    - GET catalog/blueprints/{name}/config
    - GET msgs.js
  "@desktop-gateway":
    - GET topics/rates
    - GET management/gateways/agent
    - POST ui/notifications
    - PUT views/{app}
  "@launcher":
    - POST launch
    - POST relaunch
  "@zenoh-gateway": ">=0.5 <0.6"
